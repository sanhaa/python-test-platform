{% extends "base.html" %}
{% block body_class %}center-page{% endblock %}

{% block content %}
<main class="login-card">
  <p class="eyebrow">사전 테스트</p>
  <h1>{{ title }}</h1>
  <p class="lead">{{ subtitle }}</p>

  <ul class="login-facts">
    <li><strong>{{ total }}문항</strong> · 객관식 7 + 주관식 3</li>
    <li>문항당 <strong>10점</strong>, 총 <strong>100점</strong></li>
    <li>제출 후에는 <strong>답안을 수정할 수 없습니다</strong></li>
  </ul>

  <form method="post" class="login-form">
    <label for="knox_id">Knox ID</label>
    <input type="text" id="knox_id" name="knox_id" placeholder="Knox ID를 입력하세요"
           autocomplete="off" autocapitalize="off" spellcheck="false"
           autofocus required>
    <button type="submit">시작하기</button>
  </form>

  <p class="hint">본인 Knox ID로 접속해 주세요. 대소문자는 구분하지 않습니다.</p>
</main>
{% endblock %}
